theme = "ocean-space"

[editor]
bufferline = "multiple"
default-line-ending = "lf"
icons = true
trim-trailing-whitespace = true

[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'

[editor.breadcrumb]
enable = true

[editor.cursor.shape]
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
skip-levels = 1

[editor.rulers]
columns = [101]

[editor.scroll]
padding = 8

[editor.search]
smart-case = false

[editor.spelling]
languages = ["en_US"]

[editor.statusline]
right = ["diagnostics", "selections", "register", "position", "file-encoding", "file-line-ending", "file-type"]

[editor.whitespace.render]
default = "trailing"
tab = "all"

[keys.normal]
C-h = ":buffer-previous"
C-l = ":buffer-next"
C-s = ":write"
C-q = ":buffer-close"
C-d = ["page_cursor_half_down", "align_view_center"]
C-u = ["page_cursor_half_up", "align_view_center"]
C-j = "save_selection"
X = "extend_line_above"
ret = ["open_below", "normal_mode"]
S-ret = ["open_above", "normal_mode"]
esc = ["collapse_selection", "keep_primary_selection"]
"=" = ":format"

A-h = "jump_view_left"
A-l = "jump_view_right"
A-k = ["move_lines_up"]
A-j = ["move_lines_down"]
A-up = ["move_lines_up"]
A-down = ["move_lines_down"]

[keys.normal.space]
q = ":quit"

[keys.insert]
C-s = ["normal_mode", ":write"]
