theme = "ocean-space"

[editor]
bufferline = "multiple"
continue-comments = false
cursorline = true
default-line-ending = "lf"
end-of-line-diagnostics = "hint"
indent-heuristic = "simple"
popup-border = "all"
trim-trailing-whitespace = true
rulers = [ 100 ]
scrolloff = 8

[editor.auto-pairs]

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.indent-guides]
render = true
skip-levels = 1

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-progress-messages = true

[editor.statusline]
right = ["diagnostics", "selections", "register", "position", "file-encoding", "file-line-ending", "file-type"]

[editor.whitespace.render]
tab = "all"

[editor.file-picker]
hidden = false

[editor.search]
smart-case = false

[editor.smart-tab]
supersede-menu = true

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
A-h = "jump_view_left"
A-l = "jump_view_right"
A-up = ["move_lines_up"]
A-down = ["move_lines_down"]
C-h = ":buffer-previous"
C-l = ":buffer-next"
C-d = ["page_cursor_half_down", "align_view_center"]
C-u = ["page_cursor_half_up", "align_view_center"]
C-j = "save_selection"
C-s = ":write"
C-q = ":buffer-close"
C-r = ":reload"
ret = ["open_below", "normal_mode"]
S-ret = ["open_above", "normal_mode"]
X = "extend_line_above"
"=" = ":format"
C-y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

[keys.normal.space]
q = ":quit"

[keys.insert]
C-s = ["normal_mode", ":write"]
