theme = "ocean-space"

[editor]
scrolloff = 8
bufferline = "multiple"
cursorline = true
end-of-line-diagnostics = "hint"
line-number = "relative"
popup-border = "all"
trim-trailing-whitespace = true
rulers = [ 100 ]
indent-heuristic = "simple"
continue-comments = false
default-line-ending = "lf"

[editor.auto-pairs]

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.indent-guides]
render = true
skip-levels = 1

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-progress-messages = true
# display-inlay-hints = true

[editor.statusline]
right = ["diagnostics", "selections", "register", "position", "file-encoding", "file-line-ending", "file-type"]

[editor.whitespace.render]
tab = "all"

[editor.file-picker]
hidden = false

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
A-h = "jump_view_left"
A-l = "jump_view_right"
C-l = ":buffer-next"
C-h = ":buffer-previous"
C-d = ["page_cursor_half_down", "align_view_center"]
C-u = ["page_cursor_half_up", "align_view_center"]
C-m = "save_selection"
C-s = ":write"
C-q = ":buffer-close"
C-r = ":reload"
ret = ["open_below", "normal_mode"]
S-ret = ["open_above", "normal_mode"]
X = "extend_line_above"
"=" = ":format"
C-y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

# Move lines up and down
A-k = ["move_lines_up"]
A-j = ["move_lines_down"]
A-up = ["move_lines_up"]
A-down = ["move_lines_down"]

[keys.normal.space]
q = ":quit"

[keys.insert]
"C-s" = ["normal_mode", ":write"]
